<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Runner - World Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="skin-default">

  <!-- Game Canvas Container -->
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Retro Screen Overlays -->
  <div id="crt-overlay"></div>
  <div id="visor-frame"></div>

  <!-- Heads Up Display (HUD) -->
  <div id="hud">
    <div class="hud-block">
      <span class="label">CURRENT WORLD</span>
      <span id="hud-world-name" class="val">CORE OUTPOST</span>
    </div>
    <div class="hud-block">
      <span class="label">WALLET BALANCE</span>
      <span class="val token-text"><span id="hud-tokens">0</span> TOKENS</span>
    </div>
    <div class="hud-block">
      <span class="label">SCORE MULTIPLIER</span>
      <span id="hud-multiplier" class="val">1.0x</span>
    </div>
  </div>

  <!-- Terminal Menu Overlay -->
  <div id="overlay">
    <div class="terminal-box">
      <div class="terminal-header">
        <h1>SYSTEM.EXE</h1>
        <div class="wallet-badge"><span id="shop-tokens">0</span> TOKENS</div>
      </div>
      
      <p>Select a travel destination. Higher difficulty coordinates yield superior scrap token outputs and score generation multipliers.</p>

      <div class="tabs">
        <button class="tab-btn active">SECTOR INDEX</button>
      </div>

      <!-- Worlds Catalog Shop -->
      <div class="shop-grid" id="worlds-catalog">
        <!-- Rendered dynamically via JavaScript -->
      </div>

      <button id="close-terminal-btn" class="primary-action">INITIALIZE JUMP</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
